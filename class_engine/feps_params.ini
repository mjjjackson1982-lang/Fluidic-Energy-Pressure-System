# ============================================================================
# FEPS Cosmological Parameter Configuration File for CLASS v3.2.0
# Fluidic Energy Pressure System (FEPS) - Best-Fit Parameter Set
# ============================================================================

# --- Primary Cosmological Parameters ---
H0 = 73.040
T_cmb = 2.7255
omega_b = 0.02242
omega_cdm = 0.11933
tau_reio = 0.0544

# --- FEPS Early Relativistic Fluid & Stored Angular Momentum (SAMs) ---
# Effective relativistic degrees of freedom matching the +9.15% energy boost
N_ur = 3.52377
N_ncdm = 0

# --- Late-Time CPL Dark Energy Transition ---
# Suppresses cosmological constant fraction so fluid density tracks transition
Omega_Lambda = 0.0
w0_fld = -1.10
wa_fld = -0.10
cs2_fld = 1.0

# --- Primordial Power Spectrum ---
P_k_ini type = analytic_Pk
k_pivot = 0.05
A_s = 2.100e-9
n_s = 0.9649

# --- Requested Outputs (CMB Power Spectra & Matter Power Spectrum) ---
output = tCl,pCl,lCl,mPk
lensing = yes
l_max_scalars = 2500
P_k_max_h/Mpc = 1.0
z_pk = 0.0

# --- Output File Prefix & Verbosity ---
root = output/feps_bestfit_
write_background = yes
write_thermodynamics = yes
write_parameters = yes
input_verbose = 1
background_verbose = 1
thermodynamics_verbose = 1
perturbations_verbose = 1
